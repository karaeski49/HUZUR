name: APK derle (deneme)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur
        run: npm install

      - name: Sayfayı yerleştir
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Android projesini oluştur
        run: |
          npx cap add android

      - name: İkonları üret
        continue-on-error: true
        run: |
          npx @capacitor/assets generate --android

      - name: Android projesini eşitle
        run: |
          npx cap sync android

      - name: Bildirim simgesini ekle
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_huzur.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFF"
                android:pathData="M12,3 A9,9 0 1,0 21,12 A7,7 0 0,1 12,3 Z" />
          </vector>
          EOF

      - name: Bildirim izinlerini ekle
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>|' android/app/src/main/AndroidManifest.xml

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: huzur-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
